<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Tic Tac Toe w/ Closures</title>
  </head>
  <body>
    <div class="content">
      <h1>Tic-Tac-Toe</h1>
      <dialog id="start-dialog" closedby="none">
        <form class="start-menu">
          <input
            type="text"
            placeholder="Player One Name.."
            id="player1"
            required
          />
          <input
            type="text"
            placeholder="Player Two Name.."
            id="player2"
            required
          />
          <button type="submit" id="start-game">Start Game</button>
        </form>
      </dialog>

      <button id="reset-btn" hidden>Reset Board</button>
      <h2 class="control-message" hidden></h2>
      <div id="gameboard" hidden></div>
    </div>
    <dialog id="replay-dialog">
      <h1 id="end-message-1"></h1>
      <h2 id="end-message-2"></h2>
      <button id="replay-btn" type="button">Replay?</button>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
